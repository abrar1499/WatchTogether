name: Build Dust Signal APK (Godot)

on:
  push:
    branches: [ main, 'claude/**' ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Godot export templates and Android settings
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          cp /root/.config/godot/editor_settings-4.3.tres ~/.config/godot/ || true
          ls ~/.local/share/godot/export_templates

      # Same package id and signing key as the old app, so this installs as its update.
      # versionCode = run number, tag "v<number>".
      - name: Export APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$GITHUB_WORKSPACE/android/debug.keystore"
          ls -la "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          cd godot
          echo "${{ github.run_number }}" > version.txt
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"2.0.${{ github.run_number }}\"/" export_presets.cfg
          godot --headless --path . --import || true
          set -o pipefail
          godot --headless --path . --export-release "Android" "$GITHUB_WORKSPACE/DustSignal.apk" 2>&1 | tee export.log
          test -s "$GITHUB_WORKSPACE/DustSignal.apk" || { grep -E "ERROR|error" export.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          ls -la "$GITHUB_WORKSPACE/DustSignal.apk"
          # the same game on the Vulkan renderer, as a second app beside the first ("Dust Signal HD")
          godot --headless --path . --export-release "Android HD" "$GITHUB_WORKSPACE/DustSignalHD.apk" 2>&1 | tee export_hd.log || true
          ls -la "$GITHUB_WORKSPACE/DustSignalHD.apk" || true

      - uses: actions/upload-artifact@v4
        with:
          name: DustSignal-${{ github.run_number }}
          path: |
            DustSignal.apk
            DustSignalHD.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DustSignal-${{ github.run_number }}

      # Godot test builds go out as pre-releases: the old app's updater ignores them,
      # the Godot app's own updater sees them.
      - name: Publish release
        run: |
          gh release create "v${{ github.run_number }}" DustSignal.apk $(ls DustSignalHD.apk 2>/dev/null) \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Dust Signal v${{ github.run_number }} (Godot)" \
            --notes "$NOTES" \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || 'Manual build' }}
