name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: WatchTogether-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release for in-app updates
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WatchTogether.apk
          gh release create "v${{ github.run_number }}" WatchTogether.apk \
            --title "Watch Together v${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || 'Manual build' }}
