name: Build Pocket AI Android

on:
  push:
    branches: [ '**' ]
    paths:
      - 'app/**'
      - 'web/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android app
        env:
          VERSION_CODE: ${{ github.run_number }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|Could not|^> [^T]" build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-AI-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PocketAI.apk
          gh release create "pocket-ai-v${{ github.run_number }}" PocketAI.apk --title "Pocket AI build" --notes "$NOTES" --latest
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || 'Pocket AI Android build' }}
