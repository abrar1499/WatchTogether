name: Build Dust Signal APK

on:
  push:
    branches: [ main, 'claude/**' ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|Could not|^> [^T]" build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DustSignal-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

      # --latest=false keeps the WatchTogether app's auto-updater pointed at its own releases.
      - name: Publish release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DustSignal.apk
          gh release create "dust-signal-v${{ github.run_number }}" DustSignal.apk \
            --target "${{ github.sha }}" \
            --title "Dust Signal v${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || 'Manual build' }}
